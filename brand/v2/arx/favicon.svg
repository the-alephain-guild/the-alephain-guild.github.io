      .slit { fill: #EDE9DD; }
    }
  </style>
  <path class="ink" d="M16 3 L48 3 L61 61 L3 61 Z" stroke-width="3.4" stroke-linejoin="miter"></path>
  <rect class="slit" x="28.5" y="21" width="7" height="27"></rect>
</svg>
