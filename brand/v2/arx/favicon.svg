<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Arx · A · Keystone with the gate keys do not cross</title>
  <!-- Route A redrawn to fill the frame: at 16px the margin route A leaves is
       pixels the mark cannot spare. Both colourways ship in this one file. -->
  <style>
