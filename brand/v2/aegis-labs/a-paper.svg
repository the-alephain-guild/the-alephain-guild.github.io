<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Aegis Labs · A · Square entered by two channels from opposite faces</title>
  <!-- One closed outline. Two channels of equal depth enter from opposite
       faces, pass the centre and stop; each goes further in than the other
       permits, and the wall between them is 12 units so that at 16 px it is
       still a wall and not a grey line (at 10 the raster breaks into four
       pieces; at 12 every edge lands on the pixel grid). Nothing is enclosed
       and nothing is a perimeter: the body is air, entered twice. 180-degree
       rotationally symmetric to 0.00 % - the second channel is the first one
       turned, exactly - and mirror-asymmetric on purpose: mirrored, the two
       channels would stack into an H and neither would pass the other.
       It reads as a letter in a frame to some strangers, and that is accepted:
       a zigzag in a rectangle is a letter at every orientation, no letter here
       is a public initial in the estate, and a letter carries no meaning that
       competes with the mark's. -->
  <path d="M10 10 L38 10 L38 38 L46 38 L46 10 L54 10 L54 54 L26 54 L26 26 L18 26 L18 54 L10 54 Z" fill="none" stroke="#0F1115" stroke-width="2.6" stroke-linejoin="miter"></path>
</svg>
